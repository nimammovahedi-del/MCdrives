name: Build block world

on:
  workflow_dispatch:
    inputs:
      area:
        description: Area config under areas/ (without .json)
        default: irvine-core
      only:
        description: Chunk ids to build, comma-separated (blank = all)
        default: ""
      reuse:
        description: Run id of an earlier build of this area whose chunks to reuse; with "only", just those chunks are rebuilt and the whole area is joined again
        default: ""
      world:
        description: Also push each built chunk's raw world and OSM dump to a world/<area>-<chunk> branch (for debugging the converter)
        default: "false"
  push:
    branches: [main]
    paths: ["areas/irvine-core.json", "tools/**", "web/**", "build.py", ".github/workflows/build.yml"]

permissions:
  contents: write
  actions: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  ARNIS_REF: ebefb3f034ed289daa919f7bade9d52673d3b004
  AREA: ${{ inputs.area || 'irvine-core' }}

jobs:
  # An area larger than its max_chunk_km2 is a grid of chunks. Each chunk is its own Arnis bake, so
  # they run as one matrix job each, and a last job joins their outputs into one world.
  plan:
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.plan.outputs.ids }}
      keep: ${{ steps.plan.outputs.keep }}
      joined: ${{ steps.plan.outputs.joined }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: plan
        run: |
          ONLY="${{ inputs.only }}"
          ALL=$(python build.py "areas/$AREA.json" --plan-ids)
          IDS=$(ONLY="$ONLY" ALL="$ALL" python -c '
          import json, os
          ids = json.loads(os.environ["ALL"])
          only = [s for s in os.environ["ONLY"].split(",") if s.strip()]
          if only: ids = [i for i in ids if i in only]
          if not ids: raise SystemExit("no chunk matched")
          print(json.dumps(ids))')
          echo "ids=$IDS" >> "$GITHUB_OUTPUT"
          echo "keep=$ALL" >> "$GITHUB_OUTPUT"
          # Joining needs every chunk of a multi-chunk area, so not after a partial "only" run.
          # ...unless "reuse" names the run that built the other chunks.
          echo "joined=$( { [ "$IDS" = "$ALL" ] || [ -n "${{ inputs.reuse }}" ]; } && [ "$ALL" != '["all"]' ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "building $IDS of $ALL"

  chunk:
    needs: plan
    runs-on: ubuntu-latest
    env:
      MC_KEEP: ${{ needs.plan.outputs.keep }}
    timeout-minutes: 330          # GitHub kills a job at 6 h
    strategy:
      fail-fast: false
      max-parallel: 20            # a matrix may hold up to 256 jobs; this keeps the queue civil
      matrix:
        id: ${{ fromJson(needs.plan.outputs.ids) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Restore Arnis binary
        id: arnis
        uses: actions/cache@v4
        with:
          path: bin/arnis
          key: arnis-${{ runner.os }}-${{ env.ARNIS_REF }}
      - name: Build Arnis (first run only)
        if: steps.arnis.outputs.cache-hit != 'true'
        run: |
          git init -q arnis-src && cd arnis-src
          git fetch -q --depth 1 https://github.com/louis-e/arnis "$ARNIS_REF" && git checkout -q FETCH_HEAD
          cargo build --release --no-default-features
          mkdir -p ../bin && cp target/release/arnis ../bin/arnis

      - name: Build chunk ${{ matrix.id }}
        run: python build.py "areas/$AREA.json" --arnis bin/arnis --only "${{ matrix.id }}" --no-join
      - name: Build log
        if: always()
        run: tail -n 200 "build/$AREA/${{ matrix.id }}/build.log" || true

      - name: Keep the raw world on a branch
        if: inputs.world == 'true'
        run: |
          cd "build/$AREA/${{ matrix.id }}" && mkdir keep && cp -r world osm.json keep/ && (cp osm_enriched.json enrich.json keep/ 2>/dev/null || true) && cd keep
          git init -q -b "world/$AREA-${{ matrix.id }}" && git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "World of $AREA ${{ matrix.id }} from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "world/$AREA-${{ matrix.id }}"
          cd .. && rm -rf keep

      # Only the finished site travels to the join job; the raw world and OSM dump stay behind.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}
          path: build/${{ env.AREA }}/${{ matrix.id }}/site
          retention-days: 3
          compression-level: 0    # packs and height tiles are already gzipped

  join:
    needs: [plan, chunk]
    runs-on: ubuntu-latest
    env:
      MC_KEEP: ${{ needs.plan.outputs.keep }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Collect the chunks of the earlier run
        if: inputs.reuse != ''
        uses: actions/download-artifact@v4
        with:
          path: chunks
          pattern: "r*c*"
          run-id: ${{ inputs.reuse }}
          github-token: ${{ github.token }}
      - name: Collect the chunks
        uses: actions/download-artifact@v4
        with:
          path: chunks
      - name: Put them where build.py expects them
        run: |
          for d in chunks/*; do id=$(basename "$d"); mkdir -p "build/$AREA/$id"; mv "$d" "build/$AREA/$id/site"; done
          rmdir chunks
          ls -R "build/$AREA" | head -n 40

      # For one chunk this only refreshes report.json; for several it writes build/<area>/site.
      - name: Join the chunks into one world
        run: python build.py "areas/$AREA.json" --join-only

      - name: Assemble site
        run: |
          mkdir -p public
          if [ "${{ needs.plan.outputs.joined }}" != "true" ]; then
            first=$(ls -d build/$AREA/*/site | head -n 1)
            cp -r "$first"/. public/
            for d in build/$AREA/*/site; do id=$(basename "$(dirname "$d")"); mkdir -p "public/chunks/$id"; cp -r "$d"/. "public/chunks/$id/"; done
          else
            cp -rl "build/$AREA/site"/. public/   # one joined world; hard links, the packs are large
          fi
          cp build/$AREA/report.json public/report.json
          du -sh public
      - uses: actions/upload-artifact@v4
        with:
          name: site-${{ env.AREA }}
          path: public
          retention-days: 14
          compression-level: 0
      # Areas with "r2" in their file are too large for a git branch: the packs, height tiles and map tiles go to
      # the R2 bucket under a prefix of their own, meta.json gets that address as "base", and only the small files
      # are left for the branch. R2's S3 keys are derived from the API token (its id, and the SHA-256 of its value),
      # so no further secret is needed. The two newest builds of the area are kept in the bucket.
      - name: Move the world data to R2
        if: needs.plan.outputs.joined == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          R2=$(python -c "import json,sys; print(json.dumps(json.load(open('areas/$AREA.json')).get('r2') or ''))")
          if [ "$R2" = '""' ]; then echo "area has no r2 setting; the branch keeps everything"; exit 0; fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "CLOUDFLARE_API_TOKEN not set"; exit 1; fi
          BUCKET=$(echo "$R2" | jq -r .bucket); URL=$(echo "$R2" | jq -r .url); KEEP=$(echo "$R2" | jq -r '.keep // 2')
          ACCOUNT=$(sed -n 's/^account_id = "\(.*\)"/\1/p' data-worker/wrangler.toml)
          ID=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify | jq -r '.result.id // empty')
          if [ -z "$ID" ]; then ID=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/tokens/verify" | jq -r '.result.id // empty'); fi
          if [ -z "$ID" ]; then echo "could not read the API token's id"; exit 1; fi
          export AWS_ACCESS_KEY_ID="$ID" AWS_SECRET_ACCESS_KEY="$(printf %s "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)" AWS_DEFAULT_REGION=auto
          export AWS_REQUEST_CHECKSUM_CALCULATION=when_required AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
          echo "::add-mask::$AWS_SECRET_ACCESS_KEY"
          EP="https://$ACCOUNT.r2.cloudflarestorage.com"
          PREFIX="$AREA/$(date -u +%Y%m%dT%H%M)-${GITHUB_SHA::7}"
          aws s3 sync public/data "s3://$BUCKET/$PREFIX/data" --endpoint-url "$EP" --exclude "*" --include "*.bin" --include "*.png" --only-show-errors
          n=$(aws s3 ls "s3://$BUCKET/$PREFIX/data/" --endpoint-url "$EP" | wc -l); m=$(find public/data -name '*.bin' -o -name '*.png' | wc -l)
          echo "uploaded $n of $m files to $PREFIX"
          if [ "$n" != "$m" ]; then echo "upload incomplete"; exit 1; fi
          find public/data \( -name '*.bin' -o -name '*.png' \) -delete
          python - "$URL$PREFIX/" <<'PY'
          import json, sys
          m = json.load(open("public/data/meta.json")); m["base"] = sys.argv[1]
          json.dump(m, open("public/data/meta.json", "w"), separators=(",", ":"))
          PY
          aws s3 ls "s3://$BUCKET/$AREA/" --endpoint-url "$EP" | awk '$1 == "PRE" {print $2}' | sort | head -n "-$KEEP" | while read -r old; do
            echo "removing old build $AREA/$old"; aws s3 rm "s3://$BUCKET/$AREA/$old" --recursive --endpoint-url "$EP" --only-show-errors
          done
          du -sh public
      - name: Publish built site to a branch
        if: needs.plan.outputs.joined == 'true' || needs.plan.outputs.keep == '["all"]'
        run: |
          cd public && git init -q -b "built/$AREA"
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Built $AREA from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "built/$AREA"
          rm -rf .git
      # The full city is over GitHub Pages' 1 GB cap, so the site is served from Cloudflare Pages
      # (20,000 files of up to 25 MiB each on the free plan). Skipped until the two secrets exist.
      - name: Deploy to Cloudflare Pages
        if: needs.plan.outputs.joined == 'true' || needs.plan.outputs.keep == '["all"]'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "Cloudflare secrets not set; skipping deploy"; exit 0; fi
          npx --yes wrangler@4 pages project create "mcdrives-$AREA" --production-branch main || true
          npx --yes wrangler@4 pages deploy public --project-name "mcdrives-$AREA" --branch main --commit-dirty=true
