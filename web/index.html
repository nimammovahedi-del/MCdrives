<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blockville</title>
<style>

  #ui { position: absolute; top: 12px; left: 12px; background: rgba(20,24,32,.85); color: #f2f2f2; padding: 10px 12px;
        border-radius: 8px; font-size: 13px; line-height: 1.5; max-width: 300px; }
  #ui button, #ui select { font: inherit; margin: 2px 2px 2px 0; padding: 4px 9px; border-radius: 5px; border: 0; max-width: 100%; }
  #ui button.on { background: #f1c232; }
  #banner { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: #14633a; color: #fff; padding: 10px 18px;
            border-radius: 10px; display: none; align-items: center; gap: 14px; box-shadow: 0 3px 10px rgba(0,0,0,.35); max-width: 60vw; }
  #arrow { font-size: 44px; line-height: 1; font-weight: 700; }
  #bdist { font-size: 24px; font-weight: 700; } #bname { font-size: 15px; opacity: .92; }
  #trip { position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%); background: rgba(20,24,32,.88); color: #fff;
          padding: 8px 18px; border-radius: 10px; font-size: 17px; font-weight: 600; display: none; white-space: nowrap; }
  #credit { position: absolute; bottom: 4px; right: 8px; font-size: 11px; color: #123; background: rgba(255,255,255,.7); padding: 1px 5px; border-radius: 3px; }
  #load { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #123; }
</style>
</head>
<body>
<div id="load">Loading blocks…</div>
<div id="ui">
  <b id="areaname">Blockville</b> <span id="stats"></span><br>
  <button id="mNav" class="on">Navigate</button><button id="mOrbit">Overview</button><button id="mWalk">Street view</button><br>
  Drive to <select id="dest"></select><br>
  <button id="random">Random trip</button><button id="pause">Pause</button>
  <div id="help" style="opacity:.8"></div>
</div>
<div id="banner"><div id="arrow">↑</div><div><div id="bdist"></div><div id="bname"></div></div></div>
<div id="trip"></div>
<div id="credit">Map data © OpenStreetMap contributors, Overture Maps Foundation (ODbL). World generated with Arnis (Apache-2.0). Not an official Minecraft product. Not for use while driving.</div>
<script type="module">

const $ = id => document.getElementById(id);

const G = await (await fetch('roads.json')).json();

// Binary data is plain .bin, or base64 inside JSON for hosts that only serve text types.

const heights = new Int16Array(await gunzip(await loadBin('height')));

  const ix = Math.max(0, Math.min(meta.width - 1, Math.floor(x))), iz = Math.max(0, Math.min(meta.depth - 1, Math.floor(z)));
  return heights[iz * meta.width + ix] + 1;

// ---------- scene

    g.setAttribute('normal', new THREE.BufferAttribute(b.nr, 3, true));

// ---------- streaming: packs of tiles load around the point of interest and unload behind it

}).sort((a, b) => a.name.localeCompare(b.name));

// ---------- trip state
let trip = null, dist = 0, curNode = dests.find(d => d.name === 'Entertainment Way')?.node ?? 0, paused = false, speed = 0, snap = true;
const ribbon = new THREE.Mesh(new THREE.BufferGeometry(), new THREE.MeshBasicMaterial({ color: 0x2f8cff, transparent: true, opacity: 0.9, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -4 }));

$('mNav').onclick = () => setMode('nav'); $('mOrbit').onclick = () => setMode('orbit'); $('mWalk').onclick = () => setMode('walk');
const ARROW = { left: '↰', right: '↱', 'slight left': '↖', 'slight right': '↗', straight: '↑', uturn: '↶', arrive: '⚑' };

      $('bdist').textContent = toNext > 950 ? (toNext / 1000).toFixed(1) + ' km' : Math.round(toNext / 10) * 10 + ' m';
      $('bname').textContent = `${TEXT[next.kind]} ${next.name}`;
      const left = trip.L - dist, mins = Math.max(1, Math.round(left / 13 / 60));

addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
const wanted = dests.findIndex(d => d.name === (params.get('to') ?? 'Alton Parkway'));
if (wanted >= 0) { $('dest').value = wanted; if (!startTrip(dests[wanted].node)) randomTrip(); } else randomTrip();
