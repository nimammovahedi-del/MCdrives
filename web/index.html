<html lang="en">

            border-radius: 10px; display: none; align-items: center; gap: 14px; box-shadow: 0 3px 10px rgba(0,0,0,.35); max-width: 60vw; }

</head>

</div>
<div id="banner"><div id="arrow">↑</div><div><div id="bdist"></div><div id="bname"></div></div></div>
